name: Android CI / Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Keystore Environment
        id: setup-keystore
        run: |
          # Restore debug.keystore if base64 exists and debug.keystore is missing
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Check if custom release keystore secret is available
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Custom release keystore detected in secrets."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "HAS_RELEASE_KEY=true" >> $GITHUB_ENV
          else
            echo "No custom release keystore secret found."
            echo "HAS_RELEASE_KEY=false" >> $GITHUB_ENV
          fi

      - name: Build Android APK
        id: build-apk
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            echo "Building Release APK with custom release key..."
            ./gradlew :app:assembleRelease --stacktrace || {
              echo "Release build failed, falling back to assembleDebug..."
              ./gradlew :app:assembleDebug --stacktrace
            }
          else
            echo "Attempting assembleRelease or fallback to assembleDebug..."
            if ./gradlew :app:assembleRelease --stacktrace; then
              echo "Release APK built successfully!"
            else
              echo "Release build skipped/failed due to missing release key. Building assembleDebug..."
              ./gradlew :app:assembleDebug --stacktrace
            fi
          fi

      - name: Verify and Prepare APK Artifact
        id: prepare-apk
        run: |
          echo "Locating generated APK files..."
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK file generated!"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          FILE_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "APK Size: $FILE_SIZE"

          mkdir -p build-artifacts
          cp "$APK_PATH" build-artifacts/BanglaPro-Keyboard.apk
          echo "APK prepared at build-artifacts/BanglaPro-Keyboard.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaPro-Keyboard-APK
          path: build-artifacts/BanglaPro-Keyboard.apk
          retention-days: 30
